[project]
name = "ramdisk-save"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sawada", email = "use.github.mail@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]

ignore = [
    "D",
    "ANN",
    "T201",
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"